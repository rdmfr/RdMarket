services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: rdmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # Database port is NEVER published in production
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  backend:
    image: ghcr.io/rdmfr/rdmarket-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rdmarket?sslmode=disable
      APP_ENV: production
      PORT: 8080
      AUTH_REQUIRE_READ: "false"
      FORECAST_SERVICE_URL: http://forecasting:8000
      FORECAST_INTERNAL_TOKEN: ${FORECAST_INTERNAL_TOKEN:?set a strong forecast internal token}
      FORECAST_MAX_CONCURRENT_JOBS: ${FORECAST_MAX_CONCURRENT_JOBS:-2}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal_net

  forecasting:
    image: ghcr.io/rdmfr/rdmarket-forecasting:${FORECASTING_IMAGE_TAG:?set a versioned forecasting image tag}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORECAST_DB_USER: ${FORECAST_DB_USER:-rdm_forecast}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:?set the dedicated forecasting database password}
      FORECAST_DB_HOST: postgres
      FORECAST_DB_PORT: 5432
      FORECAST_DB_NAME: rdmarket
      FORECAST_INTERNAL_TOKEN: ${FORECAST_INTERNAL_TOKEN:?set a strong forecast internal token}
      FORECAST_MAX_CONCURRENT_JOBS: ${FORECAST_MAX_CONCURRENT_JOBS:-2}
      FORECAST_JOB_TIMEOUT_SECONDS: ${FORECAST_JOB_TIMEOUT_SECONDS:-900}
      FORECAST_SCHEDULER_ENABLED: "false"
      FORECAST_DEFAULT_INTERVALS: ${FORECAST_DEFAULT_INTERVALS:-0.8,0.95}
      FORECAST_ENABLE_ML: ${FORECAST_ENABLE_ML:-true}
      FORECAST_RANDOM_SEED: ${FORECAST_RANDOM_SEED:-42}
      FORECAST_LSTM_MAX_EPOCHS: ${FORECAST_LSTM_MAX_EPOCHS:-40}
      FORECAST_LSTM_WINDOW: ${FORECAST_LSTM_WINDOW:-20}
      FORECAST_LSTM_LAYERS: ${FORECAST_LSTM_LAYERS:-1}
      FORECAST_LSTM_UNITS: ${FORECAST_LSTM_UNITS:-32}
      FORECAST_LSTM_DROPOUT: ${FORECAST_LSTM_DROPOUT:-0.1}
      FORECAST_LSTM_LEARNING_RATE: ${FORECAST_LSTM_LEARNING_RATE:-0.001}
      FORECAST_LSTM_BATCH_SIZE: ${FORECAST_LSTM_BATCH_SIZE:-32}
      FORECAST_LSTM_REFIT_EVERY_N_FOLDS: ${FORECAST_LSTM_REFIT_EVERY_N_FOLDS:-5}
      FORECAST_LSTM_MAX_FOLDS: ${FORECAST_LSTM_MAX_FOLDS:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  frontend:
    image: ghcr.io/rdmfr/rdmarket-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata_prod:
