services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: rdmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # Database port is NEVER published in production
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  backend:
    image: ghcr.io/rdmfr/rdmarket-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rdmarket?sslmode=disable
      APP_ENV: production
      PORT: 8080
      AUTH_REQUIRE_READ: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal_net

  frontend:
    image: ghcr.io/rdmfr/rdmarket-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata_prod:
