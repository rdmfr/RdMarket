services:
  postgres:
    image: postgres:16-alpine
    container_name: rdmarket-postgres
    restart: always
    environment:
      POSTGRES_DB: rdmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      FORECAST_DB_USER: ${FORECAST_DB_USER:-rdm_forecast}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:-rdmarket-dev-forecast-password-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-forecast-role.sh:/docker-entrypoint-initdb.d/002_forecast_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdmarket-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rdmarket?sslmode=disable
      EXCHANGE_RATE_PROVIDER: mock
      EXCHANGE_RATE_API_URL: https://api.frankfurter.dev/v1
      EXCHANGE_RATE_API_KEY: ""
      APP_ENV: development
      PORT: 8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "$$2a$$10$$l7ofOGwF/s0KSIAgKdRz1.1FDfS8/h.LLopGGuL10YugLiZl69qPa"
      SESSION_SECRET: "dev-session-secret-min-32-chars-long"
      AUTH_REQUIRE_READ: "false"
      SHORT_TERM_THRESHOLD: 0.002
      TREND_30D_THRESHOLD: 0.005
      VOLATILITY_LOW_LIMIT: 0.004
      VOLATILITY_HIGH_LIMIT: 0.010
      FORECAST_SERVICE_URL: http://forecasting:8000
      FORECAST_INTERNAL_TOKEN: ${FORECAST_INTERNAL_TOKEN:-rdmarket-dev-forecast-token-change-me-32}
      FORECAST_MAX_CONCURRENT_JOBS: ${FORECAST_MAX_CONCURRENT_JOBS:-2}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  forecasting:
    build:
      context: ./forecasting
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${FORECAST_INSTALL_ML:-true}
    container_name: rdmarket-forecasting
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORECAST_DB_USER: ${FORECAST_DB_USER:-rdm_forecast}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:-rdmarket-dev-forecast-password-change-me}
      FORECAST_DB_HOST: postgres
      FORECAST_DB_PORT: 5432
      FORECAST_DB_NAME: rdmarket
      FORECAST_INTERNAL_TOKEN: ${FORECAST_INTERNAL_TOKEN:-rdmarket-dev-forecast-token-change-me-32}
      FORECAST_MAX_CONCURRENT_JOBS: ${FORECAST_MAX_CONCURRENT_JOBS:-2}
      FORECAST_JOB_TIMEOUT_SECONDS: ${FORECAST_JOB_TIMEOUT_SECONDS:-900}
      FORECAST_SCHEDULER_ENABLED: ${FORECAST_SCHEDULER_ENABLED:-false}
      FORECAST_DEFAULT_INTERVALS: ${FORECAST_DEFAULT_INTERVALS:-0.8,0.95}
      FORECAST_ENABLE_ML: ${FORECAST_ENABLE_ML:-true}
      FORECAST_RANDOM_SEED: ${FORECAST_RANDOM_SEED:-42}
      FORECAST_LSTM_MAX_EPOCHS: ${FORECAST_LSTM_MAX_EPOCHS:-40}
      FORECAST_LSTM_WINDOW: ${FORECAST_LSTM_WINDOW:-20}
      FORECAST_LSTM_LAYERS: ${FORECAST_LSTM_LAYERS:-1}
      FORECAST_LSTM_UNITS: ${FORECAST_LSTM_UNITS:-32}
      FORECAST_LSTM_DROPOUT: ${FORECAST_LSTM_DROPOUT:-0.1}
      FORECAST_LSTM_LEARNING_RATE: ${FORECAST_LSTM_LEARNING_RATE:-0.001}
      FORECAST_LSTM_BATCH_SIZE: ${FORECAST_LSTM_BATCH_SIZE:-32}
      FORECAST_LSTM_REFIT_EVERY_N_FOLDS: ${FORECAST_LSTM_REFIT_EVERY_N_FOLDS:-5}
      FORECAST_LSTM_MAX_FOLDS: ${FORECAST_LSTM_MAX_FOLDS:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rdmarket-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
