openapi: 3.1.0
info:
  title: RdMarket Intelligence API
  version: 1.0.0
  description: Analytical USD/IDR market monitoring, forecasting, and backtesting API.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /ready:
    get:
      operationId: getReady
      summary: Readiness check (checks database and active dependencies)
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /auth/login:
    post:
      operationId: authLogin
      summary: Minimal single-tenant admin authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Successful authentication, sets httpOnly session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /auth/logout:
    post:
      operationId: authLogout
      summary: Clears session cookie
      responses:
        "200":
          description: Session terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Returns current session authentication state
      responses:
        "200":
          description: Current user session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /data-sources:
    get:
      operationId: getDataSources
      summary: Provider capabilities, granularity, and status
      responses:
        "200":
          description: Active data source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /economic/indicators:
    get:
      operationId: getEconomicIndicators
      summary: Active economic indicator catalog and latest stored observations
      responses:
        "200":
          description: Indicator catalog with latest values or null when no observations are stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          { $ref: "#/components/schemas/EconomicIndicator" }
        "401":
          description: Authentication required when read access is protected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "503":
          description: Economic data store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
  /economic/indicators/{code}:
    get:
      operationId: getEconomicIndicator
      summary: Economic indicator metadata and latest stored observation
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Indicator metadata and latest observation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EconomicIndicator" }
        "401":
          description: Authentication required when read access is protected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "404":
          description: Indicator not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "503":
          description: Economic data store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
  /economic/indicators/{code}/history:
    get:
      operationId: getEconomicIndicatorHistory
      summary: Point-in-time economic observation history and revisions
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [1M, 3M, 1Y, 5Y], default: 1Y }
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
        - name: revisions
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Observations with reference date, release timestamp, retrieval time, and revision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          { $ref: "#/components/schemas/EconomicObservation" }
        "401":
          description: Authentication required when read access is protected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "404":
          description: Indicator not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "422":
          description: Invalid date range or revisions parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
        "503":
          description: Economic data store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponseEnvelope" }
  /market/usdidr/current:
    get:
      operationId: getCurrentRate
      summary: Latest stored USD/IDR observation
      responses:
        "200":
          description: Latest observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: No observation available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /market/usdidr/history:
    get:
      operationId: getHistory
      summary: Historical observations
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [1D, 7D, 1M, 3M, 6M, 1Y, 5Y]
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Historical rate points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /market/usdidr/statistics:
    get:
      operationId: getStatistics
      summary: Deterministic statistics (52-week high/low, changes, averages)
      responses:
        "200":
          description: Calculated market statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /market/usdidr/indicators:
    get:
      operationId: getIndicators
      summary: SMA and market condition indicators
      parameters:
        - name: range
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Technical and market condition indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /market/usdidr/condition:
    get:
      operationId: getMarketCondition
      summary: Transparent descriptive market-condition labels
      parameters:
        - name: range
          in: query
          schema:
            { type: string, enum: [1D, 7D, 1M, 3M, 6M, 1Y, 5Y], default: 1M }
      responses:
        "200":
          description: Rule-based market condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/models:
    get:
      operationId: getForecastModels
      summary: Supported forecast models and minimum history requirements
      responses:
        "200":
          description: Forecast model catalog, including optional model availability and minimum history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastModelCatalogResponse"
  /forecast/usdidr/latest:
    get:
      operationId: getLatestForecast
      summary: Latest stored forecast with intervals and baseline comparison
      parameters:
        - name: model
          in: query
          schema: { type: string }
        - name: horizon
          in: query
          schema: { type: integer, enum: [1, 5, 10, 21, 63] }
      responses:
        "200":
          description: Forecast run, forecasts, recent history, and naive baseline comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: No completed forecast is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Unsupported model or horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/runs/{id}:
    get:
      operationId: getForecastRun
      summary: Forecast run metadata and interval points
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Forecast run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Forecast run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/jobs:
    get:
      operationId: getForecastJobs
      summary: Paginated forecasting job list
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Forecast jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
    post:
      operationId: createForecastJob
      summary: Create a forecast or backtest job
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastJobRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "409":
          description: Concurrent job limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid job parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Forecasting service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/jobs/{id}:
    get:
      operationId: getForecastJob
      summary: Forecasting job status and progress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Forecasting job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/backtests:
    get:
      operationId: getForecastBacktests
      summary: Paginated backtest runs and summary metrics
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Backtest runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/backtests/{id}:
    get:
      operationId: getForecastBacktest
      summary: Backtest run details and evaluation metrics
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Backtest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Backtest run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/backtests/{id}/predictions:
    get:
      operationId: getForecastBacktestPredictions
      summary: Paginated walk-forward predictions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Out-of-sample predictions and observed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Backtest run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /forecast/usdidr/leaderboard:
    get:
      operationId: getForecastLeaderboard
      summary: Backtest metric comparison with naive baselines
      parameters:
        - name: horizon
          in: query
          schema: { type: integer, enum: [1, 5, 10, 21, 63], default: 1 }
      responses:
        "200":
          description: Model metrics and skill score versus naive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastLeaderboardResponse"
        "422":
          description: Unsupported forecast horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ResponseEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: {}
        meta:
          type: object
          properties:
            simulated: { type: boolean }
          additionalProperties: true
        error:
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
    EconomicIndicator:
      type: object
      required:
        - code
        - name
        - country
        - category
        - unit
        - frequency
        - seasonal_adjustment
        - source_provider
        - source_series_id
        - source_url
        - license_note
        - description
        - change_mode
        - publication_lag_days
        - latest_value
        - previous_value
        - change
        - reference_date
        - period_end
        - release_timestamp
        - retrieved_at
        - stale
        - staleness_days
        - trend
        - sparkline
      properties:
        code: { type: string }
        name: { type: string }
        country: { type: string }
        category: { type: string }
        unit: { type: string }
        frequency: { type: string, enum: [daily, weekly, monthly, quarterly] }
        seasonal_adjustment: { type: boolean }
        source_provider: { type: string }
        source_series_id: { type: string }
        source_url: { type: string, format: uri }
        license_note: { type: string }
        description: { type: string }
        change_mode: { type: string, enum: [level, percent, bps] }
        publication_lag_days: { type: integer, minimum: 1 }
        latest_value: { type: [string, "null"] }
        previous_value: { type: [string, "null"] }
        change: { type: [string, "null"] }
        reference_date: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        release_timestamp: { type: [string, "null"], format: date-time }
        retrieved_at: { type: [string, "null"], format: date-time }
        stale: { type: [boolean, "null"] }
        staleness_days: { type: [integer, "null"] }
        trend: { type: string, enum: [rising, falling, flat, not_enough_data] }
        sparkline:
          type: array
          items: { type: string }
    EconomicObservation:
      type: object
      required:
        [
          reference_date,
          period_end,
          value,
          release_timestamp,
          retrieved_at,
          revision,
          is_latest,
        ]
      properties:
        reference_date: { type: string, format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        value: { type: string }
        release_timestamp: { type: [string, "null"], format: date-time }
        retrieved_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 0 }
        is_latest: { type: boolean }
    ForecastModel:
      type: object
      required:
        - name
        - version
        - stability
        - label
        - available
        - unavailable_reason
        - min_history
        - minimum_observations
        - description
      properties:
        name:
          type: string
          enum:
            [
              naive,
              drift,
              seasonal_naive,
              ets,
              arima,
              sarima,
              ridge,
              gradient_boosting,
              lstm,
            ]
        version: { type: string }
        stability: { type: string, enum: [stable, experimental] }
        label: { type: string }
        available: { type: boolean }
        unavailable_reason:
          type: [string, "null"]
        min_history: { type: integer, minimum: 1 }
        minimum_observations: { type: integer, minimum: 1 }
        description: { type: string }
    ForecastModelCatalogResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ForecastModel"
    ForecastLeaderboardItem:
      type: object
      required:
        - model_name
        - horizon
        - mae
        - rmse
        - mape
        - mase
        - directional_accuracy
        - interval_coverage
        - skill_score_vs_naive
        - is_baseline
      properties:
        model_name: { type: string }
        horizon: { type: integer, enum: [1, 5, 10, 21, 63] }
        mae: { type: [number, "null"] }
        rmse: { type: [number, "null"] }
        mape: { type: [number, "null"] }
        mase: { type: [number, "null"] }
        directional_accuracy: { type: [number, "null"] }
        interval_coverage: { type: [number, "null"] }
        skill_score_vs_naive: { type: [number, "null"] }
        is_baseline: { type: boolean }
    ForecastLeaderboard:
      type: object
      required: [horizon, items, no_model_beats_naive, has_evaluations]
      properties:
        horizon: { type: integer, enum: [1, 5, 10, 21, 63] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ForecastLeaderboardItem"
        no_model_beats_naive: { type: boolean }
        has_evaluations: { type: boolean }
    ForecastLeaderboardResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ForecastLeaderboard"
    ForecastJobRequest:
      type: object
      required: [job_type, models, horizon]
      properties:
        job_type:
          type: string
          enum: [forecast, backtest]
        models:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [
                naive,
                drift,
                seasonal_naive,
                ets,
                arima,
                sarima,
                ridge,
                gradient_boosting,
                lstm,
              ]
        horizon:
          type: integer
          enum: [1, 5, 10, 21, 63]
        params:
          type: object
          additionalProperties: true
        force:
          type: boolean
          default: false
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rdm_session
