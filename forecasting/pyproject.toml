[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmarket-forecasting"
version = "0.1.0"
description = "Internal USD/IDR statistical, machine-learning, and LSTM forecasting service"
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
core = [
    "fastapi==0.133.0",
    "starlette==1.3.1",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "psycopg[binary]==3.2.6",
    "pydantic==2.11.3",
    "sqlalchemy==2.0.40",
    "scipy==1.15.2",
    "statsmodels==0.14.4",
    "uvicorn[standard]==0.34.0",
]
ml = [
    "scikit-learn==1.6.1",
    "keras==3.15.0",
    "tensorflow-cpu==2.18.1",
]
test = ["httpx==0.28.1", "pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
