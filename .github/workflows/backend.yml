name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rdmarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: backend
          args: --timeout=5m

      - name: Run race-enabled tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rdmarket_test?sslmode=disable
          APP_ENV: test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Test migrations (fresh up, down, up again)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rdmarket_test?sslmode=disable
          APP_ENV: test
        run: |
          go run ./cmd/server migrate-up
          go run ./cmd/server migrate-down
          go run ./cmd/server migrate-up

      - name: Build
        run: go build -o /tmp/server ./cmd/server
