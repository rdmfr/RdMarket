name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rdmfr/rdmarket-frontend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rdmfr/rdmarket-backend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Extract forecasting image metadata
        id: forecasting-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rdmfr/rdmarket-forecasting
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and publish forecasting image
        uses: docker/build-push-action@v6
        with:
          context: ./forecasting
          file: ./forecasting/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.forecasting-meta.outputs.tags }}
          labels: ${{ steps.forecasting-meta.outputs.labels }}
