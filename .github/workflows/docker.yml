name: Docker

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/rdmfr/rdmarket-frontend:test ./frontend

      - name: Build backend image
        run: |
          docker build -t ghcr.io/rdmfr/rdmarket-backend:test ./backend

      - name: Login to GHCR (main/master push only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push images (main/master push only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker tag ghcr.io/rdmfr/rdmarket-frontend:test ghcr.io/rdmfr/rdmarket-frontend:sha-${GITHUB_SHA::7}
          docker tag ghcr.io/rdmfr/rdmarket-frontend:test ghcr.io/rdmfr/rdmarket-frontend:edge
          docker push ghcr.io/rdmfr/rdmarket-frontend:sha-${GITHUB_SHA::7}
          docker push ghcr.io/rdmfr/rdmarket-frontend:edge

          docker tag ghcr.io/rdmfr/rdmarket-backend:test ghcr.io/rdmfr/rdmarket-backend:sha-${GITHUB_SHA::7}
          docker tag ghcr.io/rdmfr/rdmarket-backend:test ghcr.io/rdmfr/rdmarket-backend:edge
          docker push ghcr.io/rdmfr/rdmarket-backend:sha-${GITHUB_SHA::7}
          docker push ghcr.io/rdmfr/rdmarket-backend:edge
