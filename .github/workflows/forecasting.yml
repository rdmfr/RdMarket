name: Forecasting CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forecasting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecasting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install forecasting service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,ml]"
          python -m pip install pytest pip-audit

      - name: Run tests
        run: pytest

      - name: Audit Python dependencies
        run: pip-audit
